# Configuration du module de télé-consultation.
# Chaque clé peut être surchargée par une propriété système (-Dcle=valeur)
# ou une variable d'environnement (COTURN_SECRET pour coturn.secret, etc.).
# NE PAS mettre le secret Coturn dans ce fichier en production : utiliser
# la variable d'environnement COTURN_SECRET.

# Serveurs STUN (séparés par des virgules)
stun.urls=stun:stun.l.google.com:19302

# Serveurs TURN (Coturn configuré avec use-auth-secret / static-auth-secret)
# ex. : turn:turn.mon-hopital.fr:3478?transport=udp,turn:turn.mon-hopital.fr:3478?transport=tcp,turns:turn.mon-hopital.fr:5349?transport=tcp
turn.urls=
coturn.secret=
# Validité des identifiants TURN temporaires (secondes) : 2 heures
turn.credential.ttl.seconds=7200

# Pièces jointes : dossier HORS de l'application web ; taille max (octets) = 10 Mo
# upload.dir=C:/gestionhopital-uploads
upload.max.bytes=10485760

# Longueur maximale d'un message de chat
chat.max.length=2000
